# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - name: Validate Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VS_WEB_STUDIO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error title=Missing Firebase service account secret::Add FIREBASE_SERVICE_ACCOUNT_VS_WEB_STUDIO in GitHub repository secrets."
            exit 1
          fi

          node -e "const json = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON); for (const key of ['client_email', 'private_key', 'project_id']) { if (!json[key]) throw new Error('Missing ' + key); } if (json.project_id !== 'vs-web-studio') throw new Error('Expected project_id vs-web-studio, got ' + json.project_id);"
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VS_WEB_STUDIO }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          deploy_log="$(mktemp)"

          for attempt in 1 2 3; do
            echo "Firebase deploy attempt $attempt"
            npx -y firebase-tools@15.22.3 deploy --only hosting --project vs-web-studio --json 2>&1 | tee "$deploy_log"
            status="${PIPESTATUS[0]}"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if grep -q "is the current active version" "$deploy_log"; then
              echo "Firebase Hosting already released this version; treating this deploy as successful."
              exit 0
            fi

            sleep $((attempt * 15))
          done

          npx -y firebase-tools@15.22.3 deploy --only hosting --project vs-web-studio --debug 2>&1 | tee "$deploy_log"
          status="${PIPESTATUS[0]}"

          if grep -q "is the current active version" "$deploy_log"; then
            echo "Firebase Hosting already released this version; treating this deploy as successful."
            exit 0
          fi

          exit "$status"
