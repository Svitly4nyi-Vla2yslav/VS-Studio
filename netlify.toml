[build]
  command = "npm run build"
  publish = "dist"
  # Skip builds for branch deploys and doc-only changes to reduce queue pressure.
  ignore = """
    if [ -z "$CACHED_COMMIT_REF" ]; then
      exit 1
    fi

    if [ "$CONTEXT" = "branch-deploy" ]; then
      exit 0
    fi

    git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . \
      ':(exclude)README.md' \
      ':(exclude)**/*.md' \
      ':(exclude)docs/**' \
      ':(exclude).github/**'
  """

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.deploy-preview.environment]
  VITE_APP_ENV = "preview"

[dev]
  command = "npm run dev -- --port 5173 --strictPort"
  port = 8888
  targetPort = 5173

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/bg-space.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
