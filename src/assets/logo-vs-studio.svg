<svg width="320" height="140" viewBox="0 0 320 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="30" y1="20" x2="280" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8D5A00"/>
      <stop offset="0.35" stop-color="#E8BD4D"/>
      <stop offset="0.7" stop-color="#FFF1A5"/>
      <stop offset="1" stop-color="#B97A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <text x="58" y="83" font-family="Georgia, 'Times New Roman', serif" font-size="98" font-weight="700" fill="url(#gold)">VS</text>
    <text x="52" y="122" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="url(#gold)">WEB STUDIO</text>
  </g>
</svg>
